[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-backend"
version = "0.1.0"
description = "Atlas Personal Command Center — FastAPI Backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # ── Web Framework ─────────────────────────────────────────────
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "websockets>=12.0",
    "httpx>=0.27.0",

    # ── Database ──────────────────────────────────────────────────
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "neo4j>=5.20.0",
    "qdrant-client[fastembed]>=1.9.0",
    "redis[hiredis]>=5.0.0",

    # ── AI / LLM ──────────────────────────────────────────────────
    "langchain>=0.2.0",
    "langchain-openai>=0.1.0",
    "langchain-anthropic>=0.1.0",
    "langgraph>=0.1.0",
    "openai>=1.30.0",
    "anthropic>=0.28.0",
    "sentence-transformers>=3.0.0",
    "pydantic-ai>=0.0.9",

    # ── Security ──────────────────────────────────────────────────
    "python-jose[cryptography]>=3.3.0",
    "cryptography>=42.0.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.9",

    # ── Background Tasks ──────────────────────────────────────────
    "celery[redis]>=5.4.0",
    "kombu>=5.3.0",

    # ── OAuth & HTTP ─────────────────────────────────────────────
    "google-auth>=2.30.0",
    "google-auth-oauthlib>=1.2.0",
    "google-auth-httplib2>=0.2.0",
    "google-api-python-client>=2.130.0",
    "PyGithub>=2.3.0",
    "watchdog>=4.0.0",

    # ── Validation & Config ───────────────────────────────────────
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.0",

    # ── Observability ─────────────────────────────────────────────
    "opentelemetry-sdk>=1.25.0",
    "opentelemetry-instrumentation-fastapi>=0.46b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.46b0",
    "opentelemetry-exporter-otlp>=1.25.0",
    "structlog>=24.2.0",

    # ── Utilities ─────────────────────────────────────────────────
    "tenacity>=8.3.0",
    "orjson>=3.10.0",
    "python-dateutil>=2.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "testcontainers[postgres,neo4j]>=4.5.0",
    "httpx>=0.27.0",
    "factory-boy>=3.3.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "C4",  # comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "S",   # bandit security
    "ANN", # annotations
]
ignore = [
    "ANN101", # self type annotation
    "ANN102", # cls type annotation
    "ANN401", # dynamically typed expressions
    "S101",   # assert statements (ok in tests)
    "B008",   # function call in default argument (FastAPI Depends)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "ANN", "S106"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=80"

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true

[tool.coverage.run]
omit = ["tests/*", "alembic/*"]
